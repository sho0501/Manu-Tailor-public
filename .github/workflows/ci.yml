name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock
      - run: ruff check --config pyproject.toml app tests
      - run: mypy --config-file pyproject.toml app
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-repository.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r apps/backend/requirements.lock
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          MANU_ROOT: ${{ github.workspace }}/temp/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manu-Tailor-e2e-report
          path: |
            playwright-report/
            test-results/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: ./setup.bat
        shell: cmd
