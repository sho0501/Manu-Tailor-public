[project]
name = "manu-tailor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20", "httpx[http2]>=0.28,<1", "pypdf>=5,<7", "pillow>=11,<13", "python-docx>=1.1,<2", "python-dotenv>=1,<2", "pywebpush>=2,<3", "google-auth>=2,<3", "PyJWT[crypto]>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "types-requests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
