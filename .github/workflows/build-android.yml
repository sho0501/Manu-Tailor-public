name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - run: pnpm --filter @manu/client exec cap add android
      - run: node scripts/configure-native.mjs android
      - run: pnpm --filter @manu/client exec cap sync android
      - name: Configure Firebase if supplied
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/client/android/app/google-services.json
          fi
      - run: chmod +x apps/client/android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: apps/client/android
      - run: cp apps/client/android/app/build/outputs/apk/debug/app-debug.apk Manu-Tailor-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Manu-Tailor-android-debug.apk
          path: Manu-Tailor-android-debug.apk
          if-no-files-found: error
      - name: Signed release APK when credentials are complete
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'Release signing not configured. Debug APK generated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manu-release.jks"
          cd apps/client/android
          ./gradlew assembleRelease
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/manu-release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD --out ../../../Manu-Tailor-android-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify ../../../Manu-Tailor-android-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Manu-Tailor-android-release.apk
          path: Manu-Tailor-android-release.apk
          if-no-files-found: ignore
